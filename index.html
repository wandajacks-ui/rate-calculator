<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Freelance Rate Calculator – Know Exactly What to Charge</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f7f7f5;
    margin: 0;
    padding: 20px;
    color: #1f2937;
}

.wrap {
    max-width: 800px;
    margin: auto;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 12px;
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<h1>Free Freelance Rate Calculator – Know Exactly What to Charge</h1>
<p>Enter your income goal and expenses to instantly calculate your ideal hourly rate.</p>
</div>

<div class="card">

<label>Monthly Income Goal</label>
<input id="income" type="number" value="4000">

<label>Monthly Expenses</label>
<input id="expenses" type="number" value="1000">

<label>Hours Per Week</label>
<input id="hours" type="number" value="30">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

</div>

<script>
function calculate() {
    let income = document.getElementById("income").value;
    let expenses = document.getElementById("expenses").value;
    let hours = document.getElementById("hours").value;

    let total = Number(income) + Number(expenses);
    let monthlyHours = hours * 4;
    let rate = total / monthlyHours;
document.getElementById("result").innerText =
    "Recommended hourly rate: $" + rate.toFixed(2);
}  
</script>

</body>
</html>

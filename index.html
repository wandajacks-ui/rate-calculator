<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Rate & Income Calculators</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f7f5;
    margin: 0;
    padding: 20px;
    color: #1f2937;
}

.wrap {
    max-width: 800px;
    margin: auto;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    margin-top: 24px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 12px;
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<h1>Freelance Rate & Income Calculators</h1>
<p>Figure out what to charge, what you’ll earn, and what you need to hit your income goals.</p>
</div>

<!-- CALCULATOR 1 -->
<div class="card">
<h2>Monthly Goal → Hourly Rate</h2>

<label>Monthly Income Goal</label>
<input id="income" type="number" value="4000">

<label>Monthly Expenses</label>
<input id="expenses" type="number" value="1000">

<label>Hours Per Week</label>
<input id="hours" type="number" value="30">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>
</div>

<!-- CALCULATOR 2 -->
<div class="card">
<h2>Hourly Rate → Yearly Income</h2>

<label>Hourly Rate</label>
<input id="hourlyRate" type="number" value="35">

<label>Hours Per Week</label>
<input id="hoursPerWeekIncome" type="number" value="30">

<label>Weeks Per Year</label>
<input id="weeksPerYear" type="number" value="48">

<button onclick="calculateIncome()">Calculate</button>

<div class="result" id="incomeResult"></div>
</div>

<!-- CALCULATOR 3 -->
<div class="card">
<h2>Yearly Goal → Required Hourly Rate</h2>

<label>Yearly Income Goal</label>
<input id="yearlyGoal" type="number" value="75000">

<label>Hours Per Week</label>
<input id="hoursPerWeekGoal" type="number" value="30">

<label>Weeks Per Year</label>
<input id="weeksPerYearGoal" type="number" value="48">

<button onclick="calculateHourlyNeeded()">Calculate</button>

<div class="result" id="hourlyNeededResult"></div>
</div>

</div>

<script>
function calculate() {
    let income = document.getElementById("income").value;
    let expenses = document.getElementById("expenses").value;
    let hours = document.getElementById("hours").value;

    let total = Number(income) + Number(expenses);
    let monthlyHours = hours * 4;
    let rate = total / monthlyHours;

    document.getElementById("result").innerText =
        "Recommended hourly rate: $" + rate.toFixed(2);
}

function calculateIncome() {
    let hourlyRate = document.getElementById("hourlyRate").value;
    let hoursPerWeekIncome = document.getElementById("hoursPerWeekIncome").value;
    let weeksPerYear = document.getElementById("weeksPerYear").value;

    let annualIncome = Number(hourlyRate) * Number(hoursPerWeekIncome) * Number(weeksPerYear);

    document.getElementById("incomeResult").innerText =
        "Estimated yearly income: $" + annualIncome.toFixed(2);
}

function calculateHourlyNeeded() {
    let yearlyGoal = document.getElementById("yearlyGoal").value;
    let hoursPerWeekGoal = document.getElementById("hoursPerWeekGoal").value;
    let weeksPerYearGoal = document.getElementById("weeksPerYearGoal").value;

    let totalHours = Number(hoursPerWeekGoal) * Number(weeksPerYearGoal);
    let hourlyNeeded = Number(yearlyGoal) / totalHours;

    document.getElementById("hourlyNeededResult").innerText =
        "Required hourly rate: $" + hourlyNeeded.toFixed(2);
}
</script>

</body>
</html>
